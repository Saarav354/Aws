<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | My AWS Cloud Journey</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="error-page">
    <div class="container">
      <p class="eyebrow">Error 404</p>
      <h1>This page does not exist.</h1>
      <p class="lead">
        CloudFront asked S3 for a file that is not in the bucket, so it showed you this custom error page instead.
      </p>
      <a class="btn" href="/">Go back home</a>
    </div>
  </main>
</body>
</html>
